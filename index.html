<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>후구후구 💩</title><style>*{box-sizing:border-box}body{margin:0;background:#fff4d9;color:#493321;font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100vh}.wrap{text-align:center;width:min(96vw,460px)}h1{margin:12px 0}p{color:#826b52;margin:7px 0 12px}canvas{width:100%;aspect-ratio:4/5;background:linear-gradient(#bcecff,#f7f9d7);border:3px solid #b6d9a5;border-radius:14px;touch-action:none}.hud{display:flex;justify-content:space-between;font-weight:700;margin:10px 5px}button{border:0;border-radius:10px;background:#e38d48;color:white;padding:12px 23px;font-weight:700;cursor:pointer;margin:10px 4px}.controls{display:flex;justify-content:center;gap:45px}.controls button{font-size:25px;width:90px;touch-action:none;user-select:none}</style></head><body><div class="wrap"><h1>💩 똥 피하기</h1><p>← → / A D 이동 · 떨어지는 똥을 피해라!</p><div class="hud"><span id="score">점수 0</span><span id="best">최고 0</span></div><canvas id="game" width="400" height="500"></canvas><button id="start">게임 시작</button><div class="controls"><button id="left">◀</button><button id="right">▶</button></div></div><script>const c=document.getElementById('game'),ctx=c.getContext('2d'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),start=document.getElementById('start');let best=Number(localStorage.getItem('poopDodgeBest')||0),player=200,poops=[],keys={},running=false,score=0,last=0,spawn=0,raf=0;bestEl.textContent='최고 '+best;function emoji(s,x,y,size){ctx.font=size+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(s,x,y)}function reset(){cancelAnimationFrame(raf);player=200;poops=[];score=0;spawn=0;last=0;running=true;start.textContent='다시 시작';raf=requestAnimationFrame(frame)}function frame(t){if(!running)return;let dt=Math.min((t-last)/1000||0,.04);last=t;score+=dt*10;let speed=190+Math.min(score*1.5,350);if(keys.left)player-=dt*310;if(keys.right)player+=dt*310;player=Math.max(22,Math.min(378,player));spawn+=dt;if(spawn>Math.max(.23,.72-score/650)){spawn=0;poops.push({x:24+Math.random()*352,y:-30,r:15+Math.random()*10})}poops.forEach(p=>p.y+=speed*dt);poops=poops.filter(p=>p.y<540);for(const p of poops){if(Math.abs(player-p.x)<p.r+13&&Math.abs(449-p.y)<p.r+15){running=false;start.textContent='다시 도전';if(Math.floor(score)>best){best=Math.floor(score);localStorage.setItem('poopDodgeBest',best)}break}}draw();scoreEl.textContent='점수 '+Math.floor(score);bestEl.textContent='최고 '+best;if(running)raf=requestAnimationFrame(frame)}function draw(){ctx.clearRect(0,0,400,500);ctx.fillStyle='#90d078';ctx.fillRect(0,478,400,22);ctx.fillStyle='#fff8';for(let i=0;i<8;i++){ctx.beginPath();ctx.arc((i*83+40)%400,55+(i%3)*75,14,0,7);ctx.fill()}poops.forEach(p=>emoji('💩',p.x,p.y,p.r*2.6));emoji('🏃',player,449,44);if(!running){ctx.fillStyle='#fff9e6df';ctx.fillRect(0,0,400,500);ctx.fillStyle='#493321';ctx.textAlign='center';ctx.textBaseline='alphabetic';ctx.font='bold 29px system-ui';ctx.fillText(score?'똥 맞았다! 💩':'똥을 피해 살아남으세요!',200,225);ctx.font='18px system-ui';ctx.fillText(score?'최종 점수: '+Math.floor(score):'시작 버튼을 누르세요',200,265)}}function bind(id,key){const el=document.getElementById(id);el.addEventListener('pointerdown',e=>{e.preventDefault();keys[key]=true;el.setPointerCapture(e.pointerId)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>el.addEventListener(ev,()=>keys[key]=false))}bind('left','left');bind('right','right');window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' ','a','d','A','D'].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')keys.left=true;if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')keys.right=true;if(e.key===' '&&!running)reset()});window.addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')keys.left=false;if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')keys.right=false});start.addEventListener('click',reset);draw();</script></body></html>
